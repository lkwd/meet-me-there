<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Meet Me There</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C1C45">
<!-- Self-contained on purpose: hosts serve this page at any depth, so relative asset paths would break. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#1C1C45;color:#fff;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
  main{max-width:34rem}
  .mark{width:72px;height:72px;margin:0 auto 24px}
  h1{font-size:clamp(2.2rem,7vw,3.6rem);letter-spacing:-.035em;line-height:1;margin:0}
  p{color:#C9C3E8;font-size:1.1rem;line-height:1.6;margin:16px 0 0}
  .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
  a{display:inline-flex;align-items:center;font-weight:700;text-decoration:none;border-radius:999px;padding:14px 26px;color:#fff}
  .go{background:#DA1576}
  .go:hover{background:#C4106A}
  .alt{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
  .alt:hover{background:rgba(255,255,255,.12)}
  a:focus-visible{outline:3px solid #E8197D;outline-offset:3px}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#E8197D"/><path d="M32 46s-14-8.4-14-18a8 8 0 0 1 14-5.3A8 8 0 0 1 46 28c0 9.6-14 18-14 18z" fill="#fff"/></svg>
  <h1>Lost at sea?</h1>
  <p>We couldn't find that page. It may have moved, or the link might be wrong. Head back on board and we'll get you where you're going.</p>
  <div class="row">
    <a class="go" id="home" href="/">Back to Meet Me There</a>
    <a class="alt" id="faq" href="/faq/">Help &amp; FAQs</a>
  </div>
</main>
<script>
  // On a github.io project site the home is /<repo>/, not /. Everywhere else it is the domain root.
  (function(){
    var base = "/";
    if (/\.github\.io$/.test(location.hostname)) base = "/" + location.pathname.split("/")[1] + "/";
    document.getElementById("home").href = base;
    document.getElementById("faq").href = base + "faq/";
  })();
</script>
</body>
</html>
